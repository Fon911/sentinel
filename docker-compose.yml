services:
  db:
    image: postgres:16-alpine
    container_name: sentineldb
    environment:
      POSTGRES_PASSWORD: secret
    ports:
      - "5401:5432"
    volumes:
      - sentinel_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sentinelredis
    ports:
      - "6379:6379"

volumes:
  sentinel_pgdata: